name: 株価データの取得

on:
  schedule:
    # 時刻はUTC。日本時間は+9時間。
    # GitHubの予約実行は混雑で30〜45分遅れたり、飛ばされたりすることがある。
    # そのためレポート係（Claude）がレポートの直前に手動実行（workflow_dispatch）で取りに行くのが本命で、
    # ここの予約実行は「予備」。
    - cron: "7 22 * * 0-4"    # 平日 7:07 JST
    - cron: "41 2 * * 1-5"    # 平日 11:41 JST
    - cron: "43 6 * * 1-5"    # 平日 15:43 JST
    - cron: "13 7 * * 1-5"    # 平日 16:13 JST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ライブラリのインストール
        run: pip install --quiet "yfinance>=0.2.50" pandas requests lxml

      - name: 株価を取得
        run: python scripts/fetch_prices.py

      - name: 業績・開示・ニュースを取得
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/fetch_extras.py

      - name: 変更を保存
        if: always()
        run: |
          git config user.name "stock-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "株価データ更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git pull --rebase --quiet || true
            git push
          fi
